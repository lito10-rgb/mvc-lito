name: Deploy Cafe Peruano

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, bcmath, curl, gd, json, mbstring, openssl, pdo, pdo_mysql, tokenbank, xml, ctype, dom, fileinfo, filter, hash, intl, json, session, simplexml, xmlreader, xmlwriter, zip

      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader --no-scripts --no-interaction
        env:
          COMPOSER_MEMORY_LIMIT: -1

      - name: Setup Node & build assets
        run: |
          npm ci
          npm run build

      - name: Remove dev files
        run: |
          rm -rf .git node_modules tests .github
          rm -f .gitignore .env.example

      - name: Create .env from secrets
        run: |
          cat > .env << 'ENVEOF'
          APP_NAME=Cafe Peruano
          APP_ENV=production
          APP_DEBUG=true
          APP_URL=${{ secrets.CAFE_APP_URL }}
          APP_LOCALE=es
          APP_FAKER_LOCALE=es_PE
          APP_KEY=
          APP_MAINTENANCE_DRIVER=file
          PHP_CLI_SERVER_WORKERS=4
          BCRYPT_ROUNDS=12
          LOG_CHANNEL=stack
          LOG_STACK=single
          LOG_DEPRECATIONS_CHANNEL=null
          LOG_LEVEL=debug
          DB_CONNECTION=mysql
          DB_HOST=${{ secrets.CAFE_DB_HOST }}
          DB_PORT=3306
          DB_DATABASE=${{ secrets.CAFE_DB_DATABASE }}
          DB_USERNAME=${{ secrets.CAFE_DB_USERNAME }}
          DB_PASSWORD=${{ secrets.CAFE_DB_PASSWORD }}
          SESSION_DRIVER=database
          SESSION_LIFETIME=120
          SESSION_ENCRYPT=false
          SESSION_PATH=/
          SESSION_DOMAIN=null
          BROADCAST_CONNECTION=log
          FILESYSTEM_DISK=local
          QUEUE_CONNECTION=database
          CACHE_STORE=database
          MEMCACHED_HOST=127.0.0.1
          REDIS_CLIENT=phpredis
          REDIS_HOST=127.0.0.1
          REDIS_PASSWORD=null
          REDIS_PORT=6379
          MAIL_MAILER=log
          MAIL_SCHEME=null
          MAIL_HOST=127.0.0.1
          MAIL_PORT=2525
          MAIL_USERNAME=null
          MAIL_PASSWORD=null
          MAIL_FROM_ADDRESS="hello@example.com"
          MAIL_FROM_NAME="${APP_NAME}"
          AWS_ACCESS_KEY_ID=
          AWS_SECRET_ACCESS_KEY=
          AWS_DEFAULT_REGION=us-east-1
          AWS_BUCKET=
          AWS_USE_PATH_STYLE_ENDPOINT=false
          VITE_APP_NAME="${APP_NAME}"
          MERCADOPAGO_ENV=sandbox
          CHECKOUT_CURRENCY=USD
          ENVEOF

      - name: Generate APP_KEY
        run: |
          KEY="base64:$(openssl rand -base64 32)"
          sed -i "s|^APP_KEY=$|APP_KEY=$KEY|" .env

      - name: Zip project for robust upload
        run: |
          zip -r -q project.zip . -x "project.zip"
          ls -lh project.zip

      - name: Upload files via FTP
        run: |
          curl -T .env "ftp://${{ secrets.CAFE_FTP_HOST }}/public_html/.env" --user "${{ secrets.CAFE_FTP_USERNAME }}:${{ secrets.CAFE_FTP_PASSWORD }}" --ftp-create-dirs --connect-timeout 30 2>&1
          curl -T project.zip "ftp://${{ secrets.CAFE_FTP_HOST }}/public_html/project.zip" --user "${{ secrets.CAFE_FTP_USERNAME }}:${{ secrets.CAFE_FTP_PASSWORD }}" --connect-timeout 120 --retry 2 2>&1
          curl -T deploy/extract-vendor.php "ftp://${{ secrets.CAFE_FTP_HOST }}/public_html/deploy/extract-vendor.php" --user "${{ secrets.CAFE_FTP_USERNAME }}:${{ secrets.CAFE_FTP_PASSWORD }}" --ftp-create-dirs --connect-timeout 30 2>&1
          curl -T deploy/clear-cache.php "ftp://${{ secrets.CAFE_FTP_HOST }}/public_html/public/clear-cache.php" --user "${{ secrets.CAFE_FTP_USERNAME }}:${{ secrets.CAFE_FTP_PASSWORD }}" --connect-timeout 30 2>&1
          curl -T deploy/cafe-root-index.php "ftp://${{ secrets.CAFE_FTP_HOST }}/public_html/index.php" --user "${{ secrets.CAFE_FTP_USERNAME }}:${{ secrets.CAFE_FTP_PASSWORD }}" --connect-timeout 30 2>&1
          curl -T deploy/cafe-root-htaccess "ftp://${{ secrets.CAFE_FTP_HOST }}/public_html/.htaccess" --user "${{ secrets.CAFE_FTP_USERNAME }}:${{ secrets.CAFE_FTP_PASSWORD }}" --connect-timeout 30 2>&1

      - name: Extract project.zip & clear cache
        run: |
          sleep 5
          curl -s https://cafe-peruano.com/deploy/extract-vendor.php
          echo ""
          sleep 3
          curl -s https://cafe-peruano.com/public/clear-cache.php
          echo ""
          curl -s -o /dev/null -w "Site: %{http_code}\n" https://cafe-peruano.com
