name: Deploy Cafe Peruano

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, bcmath, curl, gd, json, mbstring, openssl, pdo, pdo_mysql, tokenbank, xml, ctype, dom, fileinfo, filter, hash, intl, json, session, simplexml, xmlreader, xmlwriter, zip

      - name: Install Composer dependencies
        continue-on-error: true
        run: composer install --no-dev --optimize-autoloader --no-scripts --no-interaction
        env:
          COMPOSER_MEMORY_LIMIT: -1

      - name: Remove dev files
        run: |
          rm -rf .git node_modules tests .github
          rm -f .env.example

      - name: Create .env from secrets
        run: |
          cat > .env << EOF
          APP_NAME=Cafe Peruano
          APP_ENV=production
          APP_DEBUG=false
          APP_URL=${{ secrets.CAFE_APP_URL }}
          APP_LOCALE=es
          DB_CONNECTION=mysql
          DB_HOST=${{ secrets.CAFE_DB_HOST }}
          DB_PORT=3306
          DB_DATABASE=${{ secrets.CAFE_DB_DATABASE }}
          DB_USERNAME=${{ secrets.CAFE_DB_USERNAME }}
          DB_PASSWORD=${{ secrets.CAFE_DB_PASSWORD }}
          EOF

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.CAFE_FTP_HOST }}
          username: ${{ secrets.CAFE_FTP_USERNAME }}
          password: ${{ secrets.CAFE_FTP_PASSWORD }}
          local-dir: ./
          server-dir: ${{ secrets.CAFE_FTP_TARGET_DIR }}
          exclude: |
            **/.git*
            **/.git*/**
            node_modules/**
            tests/**
            .env.example
