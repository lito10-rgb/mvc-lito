name: Deploy to cPanel

on:
  push:
    branches: [ master, main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, bcmath, curl, gd, json, mbstring, openssl, pdo, pdo_mysql, tokenbank, xml, ctype, dom, fileinfo, filter, hash, intl, json, session, simplexml, xmlreader, xmlwriter, zip

      - name: Install Composer dependencies
        continue-on-error: true
        run: composer install --no-dev --optimize-autoloader --no-scripts --no-interaction
        env:
          COMPOSER_MEMORY_LIMIT: -1

      - name: Remove dev files
        run: |
          rm -rf .git node_modules tests .github
          rm -f .gitignore .env.example

      - name: Create .env from secrets
        run: |
          cat > .env << 'ENVEOF'
          APP_NAME=mvc-lito
          APP_ENV=production
          APP_DEBUG=true
          APP_URL=__APP_URL__
          APP_LOCALE=es
          APP_FAKER_LOCALE=es_PE
          APP_KEY=
          APP_MAINTENANCE_DRIVER=file
          PHP_CLI_SERVER_WORKERS=4
          BCRYPT_ROUNDS=12
          LOG_CHANNEL=stack
          LOG_STACK=single
          LOG_DEPRECATIONS_CHANNEL=null
          LOG_LEVEL=debug
          DB_CONNECTION=mysql
          DB_HOST=__DB_HOST__
          DB_PORT=3306
          DB_DATABASE=__DB_DATABASE__
          DB_USERNAME=__DB_USERNAME__
          DB_PASSWORD=__DB_PASSWORD__
          SESSION_DRIVER=database
          SESSION_LIFETIME=120
          SESSION_ENCRYPT=false
          SESSION_PATH=/
          SESSION_DOMAIN=null
          BROADCAST_CONNECTION=log
          FILESYSTEM_DISK=local
          QUEUE_CONNECTION=database
          CACHE_STORE=database
          MEMCACHED_HOST=127.0.0.1
          REDIS_CLIENT=phpredis
          REDIS_HOST=127.0.0.1
          REDIS_PASSWORD=null
          REDIS_PORT=6379
          MAIL_MAILER=log
          MAIL_SCHEME=null
          MAIL_HOST=127.0.0.1
          MAIL_PORT=2525
          MAIL_USERNAME=null
          MAIL_PASSWORD=null
          MAIL_FROM_ADDRESS="hello@example.com"
          MAIL_FROM_NAME="${APP_NAME}"
          AWS_ACCESS_KEY_ID=
          AWS_SECRET_ACCESS_KEY=
          AWS_DEFAULT_REGION=us-east-1
          AWS_BUCKET=
          AWS_USE_PATH_STYLE_ENDPOINT=false
          VITE_APP_NAME="${APP_NAME}"
          MERCADOPAGO_ACCESS_TOKEN=__MP_TOKEN__
          MERCADOPAGO_PUBLIC_KEY=__MP_KEY__
          MERCADOPAGO_ENV=sandbox
          PAYPAL_CLIENT_ID=__PP_ID__
          PAYPAL_CLIENT_SECRET=__PP_SECRET__
          CHECKOUT_CURRENCY=USD
          ENVEOF
          sed -i "s|__APP_URL__|${{ secrets.APP_URL }}|g" .env
          sed -i "s|__DB_HOST__|${{ secrets.DB_HOST }}|g" .env
          sed -i "s|__DB_DATABASE__|${{ secrets.DB_DATABASE }}|g" .env
          sed -i "s|__DB_USERNAME__|${{ secrets.DB_USERNAME }}|g" .env
          sed -i "s|__DB_PASSWORD__|${{ secrets.DB_PASSWORD }}|g" .env
          sed -i "s|__MP_TOKEN__|${{ secrets.MERCADOPAGO_ACCESS_TOKEN }}|g" .env
          sed -i "s|__MP_KEY__|${{ secrets.MERCADOPAGO_PUBLIC_KEY }}|g" .env
          sed -i "s|__PP_ID__|${{ secrets.PAYPAL_CLIENT_ID }}|g" .env
          sed -i "s|__PP_SECRET__|${{ secrets.PAYPAL_CLIENT_SECRET }}|g" .env

      - name: Generate APP_KEY
        run: |
          KEY="base64:$(openssl rand -base64 32)"
          sed -i "s|^APP_KEY=$|APP_KEY=$KEY|" .env

      - name: Clear Laravel cache on server
        run: |
          echo "Deleting bootstrap/cache/config.php..."
          curl --quote "DELE ${{ secrets.FTP_TARGET_DIR }}bootstrap/cache/config.php" "ftp://${{ secrets.FTP_HOST }}/" --user "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" 2>&1 || echo "(file may not exist, continuing)"
          curl --quote "DELE ${{ secrets.FTP_TARGET_DIR }}bootstrap/cache/services.php" "ftp://${{ secrets.FTP_HOST }}/" --user "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" 2>&1 || echo "(file may not exist, continuing)"

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: ${{ secrets.FTP_TARGET_DIR }}
          dangerous-dangerous-allow-hidden-files: true
          exclude: |
            **/.git*
            **/.git*/**
            node_modules/**
            tests/**
            .env.example

      - name: Upload .env via curl (backup)
        run: |
          curl -T .env "ftp://${{ secrets.FTP_HOST }}/${{ secrets.FTP_TARGET_DIR }}.env" --user "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" --ftp-create-dirs
