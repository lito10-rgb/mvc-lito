name: Deploy to cPanel

on:
  push:
    branches: [ master, main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, bcmath, curl, gd, json, mbstring, openssl, pdo, pdo_mysql, tokenbank, xml, ctype, dom, fileinfo, filter, hash, intl, json, session, simplexml, xmlreader, xmlwriter, zip

      - name: Install Composer dependencies
        continue-on-error: true
        run: composer install --no-dev --optimize-autoloader --no-scripts --no-interaction
        env:
          COMPOSER_MEMORY_LIMIT: -1

      - name: Remove dev files
        run: |
          rm -rf .git node_modules tests .github
          rm -f .gitignore .env.example

      - name: Create .env from secrets
        run: |
          cat > .env << 'ENVEOF'
          APP_NAME=mvc-lito
          APP_ENV=production
          APP_DEBUG=true
          APP_URL=${{ secrets.APP_URL }}
          APP_LOCALE=es
          APP_FAKER_LOCALE=es_PE
          APP_KEY=
          APP_MAINTENANCE_DRIVER=file
          PHP_CLI_SERVER_WORKERS=4
          BCRYPT_ROUNDS=12
          LOG_CHANNEL=stack
          LOG_STACK=single
          LOG_DEPRECATIONS_CHANNEL=null
          LOG_LEVEL=debug
          DB_CONNECTION=mysql
          DB_HOST=${{ secrets.DB_HOST }}
          DB_PORT=3306
          DB_DATABASE=${{ secrets.DB_DATABASE }}
          DB_USERNAME=${{ secrets.DB_USERNAME }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          SESSION_DRIVER=database
          SESSION_LIFETIME=120
          SESSION_ENCRYPT=false
          SESSION_PATH=/
          SESSION_DOMAIN=null
          BROADCAST_CONNECTION=log
          FILESYSTEM_DISK=local
          QUEUE_CONNECTION=database
          CACHE_STORE=database
          MEMCACHED_HOST=127.0.0.1
          REDIS_CLIENT=phpredis
          REDIS_HOST=127.0.0.1
          REDIS_PASSWORD=null
          REDIS_PORT=6379
          MAIL_MAILER=log
          MAIL_SCHEME=null
          MAIL_HOST=127.0.0.1
          MAIL_PORT=2525
          MAIL_USERNAME=null
          MAIL_PASSWORD=null
          MAIL_FROM_ADDRESS="hello@example.com"
          MAIL_FROM_NAME="${APP_NAME}"
          AWS_ACCESS_KEY_ID=
          AWS_SECRET_ACCESS_KEY=
          AWS_DEFAULT_REGION=us-east-1
          AWS_BUCKET=
          AWS_USE_PATH_STYLE_ENDPOINT=false
          VITE_APP_NAME="${APP_NAME}"
          MERCADOPAGO_ACCESS_TOKEN=${{ secrets.MERCADOPAGO_ACCESS_TOKEN }}
          MERCADOPAGO_PUBLIC_KEY=${{ secrets.MERCADOPAGO_PUBLIC_KEY }}
          MERCADOPAGO_ENV=sandbox
          PAYPAL_CLIENT_ID=${{ secrets.PAYPAL_CLIENT_ID }}
          PAYPAL_CLIENT_SECRET=${{ secrets.PAYPAL_CLIENT_SECRET }}
          CHECKOUT_CURRENCY=USD
          ENVEOF

      - name: Generate APP_KEY
        run: |
          KEY="base64:$(openssl rand -base64 32)"
          sed -i "s|^APP_KEY=$|APP_KEY=$KEY|" .env

      - name: Clear Laravel cache via HTTP script
        env:
          CLEAN_DIR: ${{ secrets.FTP_TARGET_DIR }}
        run: |
          # Strip leading/trailing slashes
          CLEAN_DIR="${CLEAN_DIR#/}"
          CLEAN_DIR="${CLEAN_DIR%/}"
          curl -T deploy/clear-cache.php "ftp://${{ secrets.FTP_HOST }}/$CLEAN_DIR/public/clear-cache.php" --user "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" 2>&1 || true
          sleep 5
          echo "--- Cache clear result ---"
          curl -s https://equiposymaquinas.com/clear-cache.php
          echo ""
          curl -s -o /dev/null -w "Status after: %{http_code}\n" https://equiposymaquinas.com

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: ${{ secrets.FTP_TARGET_DIR }}
          dangerous-dangerous-allow-hidden-files: true
          exclude: |
            **/.git*
            **/.git*/**
            node_modules/**
            tests/**
            .env.example

      - name: Upload .env via curl (backup)
        run: |
          curl -T .env "ftp://${{ secrets.FTP_HOST }}/${{ secrets.FTP_TARGET_DIR }}.env" --user "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" --ftp-create-dirs
